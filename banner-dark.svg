<svg xmlns="http://www.w3.org/2000/svg" width="720" height="140" viewBox="0 0 720 140">
  <defs>
    <linearGradient id="ig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc273"/>
      <stop offset="50%" stop-color="#e56969"/>
      <stop offset="100%" stop-color="#c1558b"/>
    </linearGradient>
    <linearGradient id="dr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdce4a"/>
      <stop offset="50%" stop-color="#498af4"/>
      <stop offset="100%" stop-color="#21a363"/>
    </linearGradient>
    <linearGradient id="bar-ig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffc273"/>
      <stop offset="50%" stop-color="#e56969"/>
      <stop offset="100%" stop-color="#c1558b"/>
    </linearGradient>
    <linearGradient id="bar-dr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdce4a"/>
      <stop offset="50%" stop-color="#498af4"/>
      <stop offset="100%" stop-color="#21a363"/>
    </linearGradient>
  </defs>

  <!-- URL text with mixed fonts and landing-page colors -->
  <text y="55" font-size="42" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#1DA1F2" font-family="Georgia,Times New Roman,serif">alexander</tspan>
    <tspan fill="#666" font-family="Courier New,Consolas,monospace" font-weight="400" font-size="36">-</tspan>
    <tspan fill="#FF4444" font-family="Helvetica,Arial,sans-serif">carter</tspan>
    <tspan fill="#c1558b" font-family="Georgia,Times New Roman,serif" font-style="italic">.co</tspan>
    <tspan fill="#00FF41" font-family="Courier New,Consolas,monospace">.uk</tspan>
  </text>

  <!-- Five segment bars — mirrors the landing page -->
  <rect x="0"   y="76" width="134" height="6" rx="3" fill="#1DA1F2" opacity="0.9"/>
  <rect x="144" y="76" width="134" height="6" rx="3" fill="#FF4444" opacity="0.9"/>
  <rect x="288" y="76" width="134" height="6" rx="3" fill="url(#bar-ig)" opacity="0.9"/>
  <rect x="432" y="76" width="134" height="6" rx="3" fill="url(#bar-dr)" opacity="0.9"/>
  <rect x="576" y="76" width="134" height="6" rx="3" fill="#00FF41" opacity="0.9"/>

  <!-- Section labels under each bar -->
  <text y="108" font-size="11" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.3" font-weight="500">
    <tspan x="35" fill="#1DA1F2" text-anchor="middle">twitter</tspan>
    <tspan x="179" fill="#FF4444" text-anchor="middle">youtube</tspan>
    <tspan x="323" fill="#c1558b" text-anchor="middle">instagram</tspan>
    <tspan x="467" fill="#498af4" text-anchor="middle">drive</tspan>
    <tspan x="611" fill="#00FF41" text-anchor="middle">terminal</tspan>
  </text>

  <!-- Tagline -->
  <text y="132" font-size="12" fill="#888" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.5" font-style="italic">
    a fake twitter. a real terminal. an idle game you can't quit.
  </text>
</svg>
