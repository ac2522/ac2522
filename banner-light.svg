<svg xmlns="http://www.w3.org/2000/svg" width="720" height="140" viewBox="0 0 720 140">
  <defs>
    <linearGradient id="bar-ig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e56969"/>
      <stop offset="50%" stop-color="#c1558b"/>
      <stop offset="100%" stop-color="#8a49a1"/>
    </linearGradient>
    <linearGradient id="bar-dr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a820"/>
      <stop offset="50%" stop-color="#3a6fd8"/>
      <stop offset="100%" stop-color="#1a8a50"/>
    </linearGradient>
  </defs>

  <!-- URL text with mixed fonts and landing-page colors (darkened for light bg) -->
  <text y="55" font-size="42" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#1477c0" font-family="Georgia,Times New Roman,serif">alexander</tspan>
    <tspan fill="#aaa" font-family="Courier New,Consolas,monospace" font-weight="400" font-size="36">-</tspan>
    <tspan fill="#cc0000" font-family="Helvetica,Arial,sans-serif">carter</tspan>
    <tspan fill="#a0447a" font-family="Georgia,Times New Roman,serif" font-style="italic">.co</tspan>
    <tspan fill="#00a832" font-family="Courier New,Consolas,monospace">.uk</tspan>
  </text>

  <!-- Five segment bars — mirrors the landing page -->
  <rect x="0"   y="76" width="134" height="6" rx="3" fill="#1477c0"/>
  <rect x="144" y="76" width="134" height="6" rx="3" fill="#cc0000"/>
  <rect x="288" y="76" width="134" height="6" rx="3" fill="url(#bar-ig)"/>
  <rect x="432" y="76" width="134" height="6" rx="3" fill="url(#bar-dr)"/>
  <rect x="576" y="76" width="134" height="6" rx="3" fill="#00a832"/>

  <!-- Section labels under each bar -->
  <text y="108" font-size="11" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.3" font-weight="500">
    <tspan x="35" fill="#1477c0" text-anchor="middle">twitter</tspan>
    <tspan x="179" fill="#cc0000" text-anchor="middle">youtube</tspan>
    <tspan x="323" fill="#a0447a" text-anchor="middle">instagram</tspan>
    <tspan x="467" fill="#3a6fd8" text-anchor="middle">drive</tspan>
    <tspan x="611" fill="#00a832" text-anchor="middle">terminal</tspan>
  </text>

  <!-- Tagline -->
  <text y="132" font-size="12" fill="#666" font-family="Helvetica,Arial,sans-serif" letter-spacing="0.5" font-style="italic">
    a fake twitter. a real terminal. an idle game you can't quit.
  </text>
</svg>
